name: Process approvals

on:
  schedule:
    # Fallback for buttons pressed after the draft run stopped waiting (best-effort schedule).
    - cron: "23 * * * *"
    # Evening wait (18:37 KST): GitHub runs the hourly schedule only a few times a day, so buttons pressed in the
    # evening waited until the next morning (2026-11-20). This run listens for up to 340 minutes and stops as soon
    # as no draft is pending. Owner's choice over an external scheduler.
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep waiting for button presses for this many minutes (0 = check once)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: read

# Its own group: sharing the draft group made this hourly run replace (cancel) a draft run that was
# queued behind a listening draft job. GitHub keeps only one pending run per concurrency group.
concurrency:
  group: engine-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Skip while a draft run is active
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENING: ${{ github.event.schedule == '37 9 * * *' }}
        run: |
          active_drafts() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow draft.yml --limit 20 --json status \
              --jq '[.[] | select(.status != "completed")] | length'
          }
          active=$(active_drafts)
          echo "active draft runs: $active"
          # The evening wait takes over from a draft run that is still listening: wait for it (up to 2 h)
          # instead of skipping, so the evening is covered. Two listeners at once would clash on Telegram.
          waited=0
          if [ "$EVENING" = "true" ]; then
            for _ in $(seq 1 24); do
              [ "$active" = "0" ] && break
              sleep 300
              waited=$((waited + 5))
              active=$(active_drafts)
              echo "still active draft runs: $active"
            done
          fi
          echo "waited=$waited" >> "$GITHUB_OUTPUT"
          # A running draft job already handles button presses; a queued one will start soon.
          if [ "$active" != "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.busy.outputs.skip == 'false'
        uses: actions/checkout@v4
      - if: steps.busy.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process Telegram buttons
        if: steps.busy.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
          MINUTES: ${{ inputs.minutes || (github.event.schedule == '37 9 * * *' && '340') || '0' }}
          WAITED: ${{ steps.busy.outputs.waited }}
        run: |
          # The job may run 355 minutes in total: listen only for what is left after waiting for a draft run.
          if [ "$MINUTES" != "0" ] && [ -n "$WAITED" ]; then MINUTES=$((MINUTES - WAITED)); fi
          if [ "$MINUTES" != "0" ]; then python -m engine listen --minutes "$MINUTES"; else python -m engine poll; fi
      # Tell Bing & co. (IndexNow) about posts published since the last run, once their pages are live.
      # Best-effort: never fails this job and sends no Telegram message.
      - name: Announce new posts to search engines
        if: steps.busy.outputs.skip == 'false'
        continue-on-error: true
        run: python -m engine notify
      # Send "[핀터레스트]" pin drafts (image + text to copy) for live posts of sites with [pinterest] enabled.
      # Best-effort: never fails this job; a post is retried next hour until sent.
      - name: Send Pinterest pin drafts
        if: steps.busy.outputs.skip == 'false'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine pins
      - name: Save state
        if: always() && steps.busy.outputs.skip == 'false'
        run: ./scripts/commit-state.sh "Process approvals"
