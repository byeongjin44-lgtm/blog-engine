name: Test

on:
  push:
    paths-ignore: ["state/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: byeongjin44-lgtm/homerivettools
          path: vendor/homerivettools
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
      - run: python -m engine check --require-calculator
