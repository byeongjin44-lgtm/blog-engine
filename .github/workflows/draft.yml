name: Draft posts

on:
  schedule:
    - cron: "47 23 * * *" # 08:47 KST every day
  workflow_dispatch:
    inputs:
      site:
        description: "Site id (empty = all sites)"
        required: false
        default: ""
      extra:
        description: "Extra posts beyond today's quota (manual test runs)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
          SITE: ${{ inputs.site }}
          EXTRA: ${{ inputs.extra || '0' }}
        run: |
          if [ -n "$SITE" ]; then python -m engine draft --site "$SITE" --extra "$EXTRA"; else python -m engine draft --extra "$EXTRA"; fi
      - name: Save state
        if: always()
        run: ./scripts/commit-state.sh "Draft posts"
      # GitHub's schedule is best-effort (runs can be hours late), so instead of relying on the
      # hourly poll, wait here for the Approve / Reject button and handle it within seconds.
      - name: Wait for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
        run: python -m engine listen --minutes 240
      - name: Save state after approval
        if: always()
        run: ./scripts/commit-state.sh "Process approvals"
